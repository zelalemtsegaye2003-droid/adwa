# ── Adwa Cyber — CI ─────────────────────────────────────────────────────────
# Quality gate for every push and pull request:
#   1. lint + typecheck (src/, strict gate — zero errors)
#   2. production build (Next.js standalone)
#   3. full API test battery against a live dev stack
#      (mock Google OIDC + mock Ethio-CERT included)
#
# Suite results roll up into the job status — merge requires green CI.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Lint (eslint)
        run: bun run lint

      - name: Typecheck (src/ — zero-error gate)
        run: bunx tsc --noEmit -p tsconfig.ci.json

      - name: Production build
        env:
          DATABASE_URL: file:/tmp/ci-build.db
          AUTH_SECRET: ci-only-secret-not-used-at-runtime-0000000000000000000000
        run: bun run build

  test:
    name: API test battery
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45
    env:
      AUTH_SECRET: ci-secret-0123456789abcdef0123456789abcdef0123456789abcdef
      DATABASE_URL: file:/home/runner/work/adwa-cyber/adwa-cyber/db/custom.db
      # Mock Google provider (mini-services/mock-google on :3010)
      GOOGLE_CLIENT_ID: adwa-dev-mock-client.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: adwa-dev-mock-secret
      GOOGLE_AUTH_BASE: /mock-google/auth?XTransformPort=3010
      GOOGLE_TOKEN_URL: http://localhost:3010/token
      GOOGLE_JWKS_URL: http://localhost:3010/certs
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Init database
        run: |
          bunx prisma db push --skip-generate
          bun prisma/seed.ts
          bun scripts/seed-users.ts
          bun scripts/seed-soc.cjs
          bun scripts/seed-gates.ts

      - name: Run API suites (dev stack + mocks, fresh server per suite)
        run: bash scripts/run-api-tests.sh

      - name: Auth suites (bun)
        run: |
          bash scripts/ci-run-auth-suites.sh

      - name: Recovery suite (password reset + email verification)
        run: bash scripts/run-recovery-tests.sh
