# ── Adwa Cyber — CI ─────────────────────────────────────────────────────────
# Quality gate for every push and pull request:
#   1. lint + typecheck (src/, strict gate — zero errors)
#   2. production build (Next.js standalone)
#   3. full API test battery against a live dev stack
#      (mock Google OIDC + mock Ethio-CERT included)
#
# Suite results roll up into the job status — merge requires green CI.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Lint (eslint)
        run: bun run lint

      - name: Typecheck (src/ — zero-error gate)
        run: bunx tsc --noEmit -p tsconfig.ci.json

      - name: Production build
        env:
          DATABASE_URL: file:/tmp/ci-build.db
          AUTH_SECRET: ci-only-secret-not-used-at-runtime-0000000000000000000000
        run: bun run build

  test:
    name: API test battery
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45
    env:
      AUTH_SECRET: ci-secret-0123456789abcdef0123456789abcdef0123456789abcdef
      # SQLite dev schema — path is checkout-root-relative (repo-name agnostic)
      DATABASE_URL: file:${{ github.workspace }}/db/custom.db
      # Mock Google provider (mini-services/mock-google on :3010)
      GOOGLE_CLIENT_ID: adwa-dev-mock-client.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: adwa-dev-mock-secret
      GOOGLE_AUTH_BASE: /mock-google/auth?XTransformPort=3010
      GOOGLE_TOKEN_URL: http://localhost:3010/token
      GOOGLE_JWKS_URL: http://localhost:3010/certs
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Init database (full demo dataset — tests depend on it)
        run: |
          bunx prisma db push --skip-generate
          bun run db:seed
          bun run seed:users
          bun run seed:evidence
          bun run seed:evidence-links
          bun run seed:soc
          bun run seed:awareness
          bun run seed:sla
          bun run seed:gates
          bun run seed:trackc
          bun run seed:gate-evidence

      - name: Run API suites (dev stack + mocks, fresh server per suite)
        run: bash scripts/run-api-tests.sh

      - name: Auth suites (bun)
        run: |
          bash scripts/ci-run-auth-suites.sh

      - name: Recovery suite (password reset + email verification + change)
        run: bash scripts/run-recovery-tests.sh

  deploy-smoke:
    # MVP exit criterion: `docker compose up --build` boots app + Postgres +
    # Caddy from a clean checkout and /api/health returns 200.
    name: Docker compose · boot + health
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Boot the stack
        env:
          AUTH_SECRET: ci-compose-secret-0123456789abcdef0123456789abcdef01234567
          POSTGRES_PASSWORD: ci-postgres-password
        run: |
          docker compose up -d --build
          # Caddy fronts the app on :80 → wait for the full chain
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost/api/health || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          echo "health status: $code"
          [ "$code" = "200" ] || { docker compose logs app | tail -40; exit 1; }

      - name: Health payload + service root
        run: |
          curl -fsS http://localhost/api/health | grep -q '"status":"ok"'
          curl -fsS http://localhost/api | grep -q 'adwa-cyber'

      - name: Teardown
        if: always()
        run: docker compose down -v --remove-orphans
