# ── Adwa Cyber — pilot deployment stack ─────────────────────────────────────
# One command:  cp .env.example .env  → edit →  docker compose up -d
#
#   caddy  : automatic HTTPS termination (public entrypoint, :443/:80)
#   app    : Next.js standalone + migrations/seeds on boot
#   db     : PostgreSQL 16 with a healthcheck + persistent volume
#
# Backups:  sh scripts/backup-db.sh  (auto-detects PostgreSQL via DATABASE_URL)
# Restore:  sh scripts/restore-db.sh backups/<file>.sql.gz

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adwa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-adwa}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adwa} -d ${POSTGRES_DB:-adwa}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Dev-only convenience port; remove in hardened deployments:
    # ports:
    #   - "5432:5432"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Compose interpolates from .env — keep real secrets out of this file.
      DATABASE_URL: postgresql://${POSTGRES_USER:-adwa}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-adwa}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env (openssl rand -base64 48)}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost}
      # Mail (unset → reset links are printed to the app log):
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Adwa Cyber <no-reply@adwacyber.et>}
      SEED_ON_BOOT: ${SEED_ON_BOOT:-1}
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Caddy issues certificates for this domain automatically:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
